name: Save community observations

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: community-snapshot

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch public aggregate
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from "node:fs";
          const response = await fetch("https://fortnite-chest-radar-api-onetapggt.yummydot9.chatgpt.site/observations",
            { signal: AbortSignal.timeout(20_000) });
          if (!response.ok) throw new Error(`Observation service HTTP ${response.status}`);
          const data = await response.json();
          if (data.version !== "43.10" || !Array.isArray(data.points) || data.points.length > 965)
            throw new Error("Invalid observation feed");
          const points = data.points.map(({ point_id, observations }) => {
            if (!Number.isInteger(point_id) || point_id < 0 || point_id >= 965 ||
                !Number.isSafeInteger(observations) || observations < 1)
              throw new Error("Invalid observation entry");
            return { point_id, observations };
          });
          points.sort((a, b) => a.point_id - b.point_id);
          writeFileSync("community-snapshot.json", JSON.stringify({ version: data.version, points }, null, 2) + "\n");
          JS
      - name: Save changed snapshot
        run: |
          git add -- community-snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Refresh community observation snapshot"
          git push origin HEAD:main
